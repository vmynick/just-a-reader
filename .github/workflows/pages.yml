name: Közzététel (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Weboldal összeállítása
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js fonts icons vendor books _site/
          # New cache version on every deploy, so installed apps pick up the update.
          sed -i "s/const VERSION = 'jar-[^']*'/const VERSION = 'jar-${GITHUB_SHA::8}'/" _site/sw.js
          grep "const VERSION" _site/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate job (as in GitHub's template): the uploaded artifact is not always
  # listed immediately, so deploying in the same job could fail with "Found 0 artifact(s)".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Várakozás újrapróbálás előtt
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
